    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint (text shows in a system font, then swaps in). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      />
    </noscript>

    <!-- Boot screen theme: dark for the SCIO app and platform dashboards, light for the marketing site. -->
    <script>
      (() => {
        const p = location.pathname;
        const q = new URLSearchParams(location.search);
        const dark =
          /^\/(app|demo)(\/|$)/.test(p) ||
          /^\/(energy|renewable-energy|maritime|maritime-fleet|manufacturing|logistics|supply-chain|dashboard)\/?$/.test(p) ||
          q.get("launch") === "1" || q.has("industry");
        document.documentElement.setAttribute("data-boot", dark ? "dark" : "light");
        // Public site theme (light/dark), applied before first paint to avoid a flash.
        if (!dark) {
          let t = null;
          try { t = localStorage.getItem("scio_site_theme"); } catch (e) {}
          if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-site-theme", t);
        }
      })();
    </script>
    <style>
      .scio-boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #0a0d14; color: #cbd5e1; font: 500 14px Inter, system-ui, sans-serif; }
      html[data-boot="light"] .scio-boot { background: #fff; color: #5d5a54; }
      .scio-boot i { width: 36px; height: 36px; border-radius: 50%; border: 3px solid currentColor; border-top-color: transparent; opacity: 0.7; animation: scio-boot-spin 0.8s linear infinite; }
      @keyframes scio-boot-spin { to { transform: rotate(360deg); } }
    </style>

    <script>
      (() => {
        const root = document.documentElement;
        const cleanExtensionMarkers = () => {
          root.removeAttribute("data-qb-installed");
          root.removeAttribute("suppresshydrationwarning");
        };
        cleanExtensionMarkers();
        const observer = new MutationObserver(cleanExtensionMarkers);
        observer.observe(root, {
          attributes: true,
          attributeFilter: ["data-qb-installed", "suppresshydrationwarning"],
        });
        window.addEventListener("load", () => observer.disconnect(), { once: true });
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root">
      <!-- Shown until the app's first render replaces it, so a slow first visit never looks like a blank page. -->
      <div class="scio-boot" role="status"><i></i><span>Loading SCIO…</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
