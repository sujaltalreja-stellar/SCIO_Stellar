<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Cyan Glow -->
    <radialGradient id="cyanGlow" cx="30%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </radialGradient>

    <!-- Purple Glow -->
    <radialGradient id="purpleGlow" cx="75%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#cyanGlow)" />
  <rect width="1200" height="630" fill="url(#purpleGlow)" />

  <!-- Outer Border Frame -->
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5" />

  <!-- Network / Holographic Node Graphics (Decorative) -->
  <g opacity="0.35">
    <line x1="150" y1="180" x2="350" y2="120" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="350" y1="120" x2="500" y2="220" stroke="#00f0ff" stroke-width="1" />
    <line x1="500" y1="220" x2="800" y2="160" stroke="#8b5cf6" stroke-width="1" />
    <line x1="800" y1="160" x2="1050" y2="240" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="350" y1="120" x2="300" y2="450" stroke="#00f0ff" stroke-width="1" opacity="0.5" />
    <line x1="800" y1="160" x2="900" y2="480" stroke="#8b5cf6" stroke-width="1" opacity="0.5" />

    <circle cx="150" cy="180" r="4" fill="#00f0ff" />
    <circle cx="350" cy="120" r="6" fill="#00f0ff" />
    <circle cx="500" cy="220" r="5" fill="#38bdf8" />
    <circle cx="800" cy="160" r="7" fill="#8b5cf6" />
    <circle cx="1050" cy="240" r="4" fill="#a855f7" />
    <circle cx="300" cy="450" r="5" fill="#00f0ff" />
    <circle cx="900" cy="480" r="6" fill="#8b5cf6" />
  </g>

  <!-- Central Glassmorphism Card -->
  <g transform="translate(150, 100)">
    <!-- Card Glass Frame -->
    <rect width="900" height="430" rx="24" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    
    <!-- Top Glowing Accent Line -->
    <path d="M 50 0 L 850 0" stroke="url(#lineGrad)" stroke-width="3" />

    <!-- Badge -->
    <g transform="translate(280, 50)">
      <rect x="0" y="0" width="340" height="36" rx="18" fill="rgba(0, 240, 255, 0.1)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
      <text x="170" y="23" fill="#00f0ff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">
        ✦ ENTERPRISE OPERATIONS CONTROL CENTER
      </text>
    </g>

    <!-- Main Title -->
    <text x="450" y="165" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1" text-anchor="middle">
      STELLAR SCIO
    </text>

    <!-- Divider Line -->
    <line x1="300" y1="195" x2="600" y2="195" stroke="url(#lineGrad)" stroke-width="2" />

    <!-- Subtitle -->
    <text x="450" y="240" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" letter-spacing="0.5" text-anchor="middle">
      Autonomous Supply Chain, Maritime, Energy &amp; Manufacturing Intelligence
    </text>

    <!-- Module Badges -->
    <g transform="translate(100, 290)">
      <!-- Maritime -->
      <g transform="translate(0, 0)">
        <rect width="150" height="50" rx="12" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1" />
        <text x="75" y="30" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚓ Maritime AI</text>
      </g>
      <!-- Logistics -->
      <g transform="translate(180, 0)">
        <rect width="160" height="50" rx="12" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
        <text x="80" y="30" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">📦 Logistics Control</text>
      </g>
      <!-- Energy Grid -->
      <g transform="translate(360, 0)">
        <rect width="160" height="50" rx="12" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1" />
        <text x="80" y="30" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ Energy Grid</text>
      </g>
      <!-- Sentinel AI -->
      <g transform="translate(540, 0)">
        <rect width="160" height="50" rx="12" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(236, 72, 153, 0.2)" stroke-width="1" />
        <text x="80" y="30" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">🧠 Sentinel Orb AI</text>
      </g>
    </g>
  </g>
</svg>
